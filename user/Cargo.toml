cargo-features = ["per-package-target"]

[package]
name = "user"
version = "0.1.0"
edition = "2024"
license.workspace = true
forced-target = "x86_64-unknown-none"

[features]
default = ["allocator"]
allocator = []

[dependencies]
arca = { path = "../arca" }
arcane = { path = "../arcane" }
spin = { version = "0.12.3", features=["lazylock"] }
talc = "4.4.3"

[build-dependencies]
autotools = "0.2.7"
cc = "1.4.6"
