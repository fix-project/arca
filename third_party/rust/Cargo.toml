[workspace]

[package]
name = "fix-dependencies"
version = "0.1.0"
edition = "2024"

[lib]
path = "empty.rs"

[dependencies]
async-channel = { version = "=2.5.0", default-features = false }
async-lock = { version = "=3.4.2", default-features = false }
bitfield-struct = "=0.13.0"
bitint = "=0.1.1"
crossbeam-queue = { version = "=0.3.14", default-features = false, features = ["alloc"] }
derive_more = { version = "=2.1.1", default-features = false, features = ["full"] }
elf = { version = "=0.8.0", default-features = false }
embedded-io = { version = "=0.7.1", default-features = false }
hashbrown = { version = "=0.17.1", features = ["alloc", "core"] }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
log = "=0.4.34"
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
snafu = { version = "=0.9.2", default-features = false }
spin = { version = "=0.12.3", features = ["lazylock"] }
talc = "=4.4.3"
time = { version = "=0.3.55", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "=1.0.104"
bindgen = "=0.73.2"
clap = { version = "=4.6.6", features = ["derive", "env"] }
ctrlc = "=3.5.2"
env_logger = "=0.11.11"
kvm-bindings = "=0.14.1"
kvm-ioctls = "=0.25.0"
libc = "=0.2.189"
nix = { version = "=0.31.3", features = ["mman", "socket"] }
postcard = { version = "=1.1.3", features = ["use-std"] }
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
rand = "=0.10.2"
regex = "=1.13.1"
rustc-demangle = "=0.1.28"
snafu = { version = "=0.9.2", features = ["std"] }
syn = { version = "=3.0.5", features = ["full"] }
vmm-sys-util = "=0.15.0"
wasm-encoder = { version = "=0.245.1", features = ["wasmparser"] }
wasmparser = "=0.245.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "=0.2.14", features = ["global"] }
