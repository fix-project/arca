name: Build Rust

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-24.04
          repository-cache: true
      - name: Native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev gcc-multilib
      - name: Build
        run: bazel build //:artifacts

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-24.04
          repository-cache: true
      - name: Native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev gcc-multilib
      - name: Enable KVM access
        run: |
          sudo modprobe kvm
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Test
        run: bazel test --keep_going --local_test_jobs=2 //...
      - name: Test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs
          path: bazel-testlogs/**/test.*
          if-no-files-found: ignore

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-24.04
          repository-cache: true
      - name: Check formatting
        run: bazel test //tests:format

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-24.04
          repository-cache: true
      - name: Native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev gcc-multilib
      - name: Check lint
        run: bazel test //tests:lint
