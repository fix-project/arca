name: Build Rust

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    uses: ./.github/workflows/bootstrap.yml

  build:
    needs: bootstrap
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-26.04
          repository-cache: true
      - name: Restore bootstrap build outputs
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: ${{ needs.bootstrap.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-format clang-tidy libclang-dev gcc-multilib binaryen cpio libzstd1 zlib1g
      - uses: ./.github/actions/llvm-sdk
      - name: Enable KVM access
        run: |
          sudo modprobe kvm
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Build
        run: bazel build --config=ci //:artifacts
      - name: Build release Fix
        run: bazel build --config=ci --config=release //fix/cli:fix
      - name: Stage release Fix
        run: install -Dm755 "$(bazel cquery --config=ci --config=release //fix/cli:fix --output=files)" "$RUNNER_TEMP/fix-artifact/fix"
      - name: Upload release Fix
        uses: actions/upload-artifact@v4
        with:
          name: fix
          path: ${{ runner.temp }}/fix-artifact/fix
          if-no-files-found: error

  test:
    needs: bootstrap
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-26.04
          repository-cache: true
      - name: Restore bootstrap build outputs
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: ${{ needs.bootstrap.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-format clang-tidy libclang-dev gcc-multilib binaryen cpio libzstd1 zlib1g
      - uses: ./.github/actions/llvm-sdk
      - name: Enable KVM access
        run: |
          sudo modprobe kvm
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Test
        run: bazel test --config=ci --keep_going --local_test_jobs=2 //:tests
      - name: Test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs
          path: bazel-testlogs/**/test.*
          if-no-files-found: ignore

  format:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-26.04
          repository-cache: true
      - name: Native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-format clang-tidy libclang-dev gcc-multilib binaryen cpio libzstd1 zlib1g
      - uses: ./.github/actions/llvm-sdk
      - name: Check formatting
        run: bazel test --config=ci //tests:format

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-26.04
          repository-cache: true
      - name: Native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-format clang-tidy libclang-dev gcc-multilib binaryen cpio libzstd1 zlib1g
      - uses: ./.github/actions/llvm-sdk
      - name: Check lint
        run: bazel test --config=ci //tests:lint
