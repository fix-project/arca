cargo-features = ["per-package-target"]

[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
license.workspace = true
forced-target = "x86_64-unknown-none"

[[example]]
name = "hello"
test = false

[[example]]
name = "threads"
test = false

[[example]]
name = "webserver"
test = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
klog-trace = []
klog-debug = []
klog-info = []
klog-warn = []
klog-error = []
klog-off = []
debugcon = []

[dependencies]
bitfield-struct = "0.13.0"
log = "0.4.34"
time = { version = "0.3.55", default-features = false, features = ["alloc"] }
macros = { path = "../macros" }
common = { path = "../common", default-features = false, features = ["core_local_cache"] }
# common = { path = "../common", default-features = false }
arca = { path = "../arca", features = ["alloc", "serde"] }
hashbrown = { version = "0.17.1", features = ["alloc", "core"] }
arcane = { path = "../arcane" }
async-lock = { version = "3.4.2", default-features = false }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }


[build-dependencies]
anyhow = "1.0.104"
cc = "1.4.6"

[dev-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
user = { path = "../user", artifact = "bin", target = "x86_64-unknown-none" }
