[package]
name = "vmm"
version = "0.1.0"
edition = "2021"

[dependencies]
kvm-bindings = { version = "0.13.0" }
kvm-ioctls = "0.23.0"
arca = { path = "../arca" }
common = { path = "../common" }
elf = "0.7.4"
env_logger = "0.11.6"
log = "0.4.25"
rustc-demangle = "0.1.24"
anyhow = "1.0.97"
libc = "0.2.174"
vmm-sys-util = "0.14.0"
ctrlc = "3.4.7"
regex = "1.11.1"
nix = { version = "0.30.1", features = ["mman", "socket"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = "1.0.228"
