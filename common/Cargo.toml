[package]
name = "common"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = ["std"]
std = ["alloc", "snafu/std", "libc", "nix"]
alloc = []
thread_local_cache = ["cache"]
core_local_cache = ["cache"]
cache = []
nix = ["dep:nix"]

[dependencies]
log = "0.4.34"
snafu = { version="0.9.2", default-features=false }
macros = { path = "../macros" }
arca = { path = "../arca" }
libc = { version="0.2.189", optional=true }
elf = { version = "0.8.0", default-features = false }
hashbrown = { version = "0.17.1", features = ["alloc", "core"] }
derive_more = { version = "2.1.1", default-features = false, features = ["full"] }
nix = { version = "0.31.3", features = ["mman"], optional = true }
async-channel = { version = "2.5.0", default-features = false }
async-lock = { version = "3.4.2", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
embedded-io = { version = "0.7", default-features = false }

[target.'cfg(target_os="linux")'.dev-dependencies]
rand = "0.10.2"
