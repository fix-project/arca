cargo-features = ["per-package-target"]

[package]
name = "fix"
version = "0.1.0"
edition = "2024"
license.workspace = true
forced-target = "x86_64-unknown-none"

[lib]
harness = false

[features]
klog-trace = ["kernel/klog-trace"]
klog-debug = ["kernel/klog-debug"]
klog-info = ["kernel/klog-info"]
klog-warn = ["kernel/klog-warn"]
klog-error = ["kernel/klog-error"]
klog-off = ["kernel/klog-off"]
debugcon = ["kernel/debugcon"]

[dependencies]
arca = { path = "../arca" }
kernel = { path = "../kernel" }
macros = { path = "../macros" }
common = { path = "../common", default-features = false }
fixhandle = { path = "handle" }
log = "0.4.34"
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
arcane = { version = "0.1.0", path = "../arcane" }
postcard = { version = "1.1.3", features = ["alloc"] }
derive_more = { version = "2.1.1", default-features = false, features = ["full"] }
user = { path = "../user", artifact = "bin", target = "x86_64-unknown-none" }
async-lock = { version = "3.4.2", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
bitint = "0.1.1"
crossbeam-queue = { version = "0.3.14", default-features = false, features = ["alloc"] }

[build-dependencies]
fixshell = { path = "shell", artifact="staticlib", target = "x86_64-unknown-none" }
fixpostprocessor = { path = "postprocessor" }
fixparser = { path = "parser", artifact = "cdylib", target = "wasm32-unknown-unknown" }
anyhow = "1.0.104"
cc = "1.4.6"
cmake = "0.1.58"
include_directory = "0.1.1"
